version: '3'

# Runtime inputs load once from the lab-root .env (top-level dotenv, resolved relative to the lab root
# regardless of a task's `dir:`). A missing .env is harmless, so cost-free tasks still run on a clean
# checkout.
dotenv: ['.env']

# Lifecycle for the aws-gcp/victoriametrics-eks-to-gke lab.
#
# Imitates migrating an observability stack between clouds: VictoriaMetrics + VictoriaLogs on EKS (the
# SOURCE) are filled with metrics and logs, then moved to VictoriaMetrics + VictoriaLogs on GKE (the
# TARGET) — over a private, BGP-routed IPsec VPN, with no public data path at any point.
#
# Flow:
#   1. init-state    -> one-time: create the GCS bucket for Terraform state.
#   2. up            -> both VPCs, both clusters, and the three-phase VPN.
#   3. vpn-status    -> assert the tunnels are up and BGP has exchanged routes (cost-free, run first).
#   4. deploy        -> VM + VL + collectors on both clusters; Grafana + the dashboard on the target.
#   5. seed          -> write the deterministic, backdated dataset into the SOURCE.
#   6. migrate       -> a Job in the TARGET pulls metrics (vmctl) and logs across the VPN.
#   7. verify        -> exact full-history diff of the seed dataset; publishes the verdict as metrics.
#   8. grafana       -> port-forward Grafana and look at the before/after dashboard.
#   9. down          -> tear it all down.
#
# Only init-state, up and deploy create cloud resources. fmt/validate/plan/vpn-status are cost-free.
#
# COST: an EKS control plane, a NAT gateway, 2 EC2 nodes, a GKE Autopilot cluster, Cloud NAT, two
# internal load balancers, two AWS VPN connections and two Cloud VPN tunnels. Roughly $0.85/hour while
# up. `task down` matters more here than in most labs.

vars:
  # --- Clusters ---
  SOURCE_CLUSTER: vmmig-source
  TARGET_CLUSTER: vmmig-target
  # kubeconfig context aliases, so every command says which cluster it means instead of depending on
  # whatever `current-context` happens to be. Two clusters and an ambient context is how you end up
  # seeding the target by accident.
  SOURCE_CTX: vmmig-source
  TARGET_CTX: vmmig-target

  NS: observability

  # --- Pinned chart versions (reproducibility) ---
  VM_STACK_CHART: 0.93.0
  VL_CHART: 0.13.9
  VL_COLLECTOR_CHART: 0.3.7

  # Release names. `vl` is load-bearing: it makes the VictoriaLogs Service
  # `vl-victoria-logs-single-server` on both clusters, which the scripts and values files rely on.
  VM_RELEASE: vm
  VL_RELEASE: vl
  VLC_RELEASE: vlc

  # Records the migration window so `migrate` and `verify` cannot disagree about what was supposed to
  # move. Gitignored.
  WINDOW_FILE: .migration-window

  # Resolves the two source endpoints (AWS internal load balancer hostnames) and the migration window.
  # Inlined into task bodies rather than declared as `sh:` vars because `sh:` vars do NOT inherit a
  # task's dotenv env, which would make kubectl/terragrunt run against empty configuration.
  RESOLVE_ENDPOINTS: |
    SOURCE_VM_HOST="$(kubectl --context {{.SOURCE_CTX}} -n {{.NS}} get svc vmsingle-endpoint \
      -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
    SOURCE_VL_HOST="$(kubectl --context {{.SOURCE_CTX}} -n {{.NS}} get svc vl-private-lb \
      -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
    if [ -z "$SOURCE_VM_HOST" ] || [ -z "$SOURCE_VL_HOST" ]; then
      echo "ERROR: the source's internal load balancers have no hostname yet." >&2
      echo "       They take a minute or two to provision. Check with:" >&2
      echo "       kubectl --context {{.SOURCE_CTX}} -n {{.NS}} get svc vmsingle-endpoint vl-private-lb" >&2
      exit 1
    fi

tasks:
  default:
    cmds: [task --list]
    silent: true

  init-env:
    desc: Create a local .env from the template (no-op if .env already exists, so it never clobbers your values)
    cmds:
      - |
        if [ -f .env ]; then
          echo ".env already exists — leaving it untouched."
        else
          cp .env.example .env
          echo "Created .env from .env.example — fill in your values."
        fi

  init-state:
    desc: Create the GCS bucket for Terraform/Terragrunt remote state (idempotent; run once before `up`)
    cmds:
      - |
        : "${GCP_PROJECT:?set GCP_PROJECT=<project id>}"
        : "${TF_STATE_BUCKET:?set TF_STATE_BUCKET=<bucket name (no gs:// prefix)>}"
        LOCATION="${GCP_REGION:-us-central1}"
        if gcloud storage buckets describe "gs://$TF_STATE_BUCKET" --project "$GCP_PROJECT" >/dev/null 2>&1; then
          echo "Bucket gs://$TF_STATE_BUCKET already exists — nothing to do."
        else
          echo "Creating gs://$TF_STATE_BUCKET in $LOCATION..."
          gcloud storage buckets create "gs://$TF_STATE_BUCKET" \
            --project "$GCP_PROJECT" \
            --location "$LOCATION" \
            --uniform-bucket-level-access \
            --public-access-prevention
        fi
        gcloud storage buckets update "gs://$TF_STATE_BUCKET" --versioning

  # --- Cost-free checks ---------------------------------------------------------------------------
  fmt:
    desc: Format Terragrunt HCL
    cmds:
      - terragrunt hcl format

  validate:
    desc: Validate every infra unit (cost-free)
    dir: infra
    cmds: [terragrunt run --all validate]

  build:
    desc: 'Compile the migrator (cost-free) — catches a type error before any cloud resource is touched'
    dir: deploy/migrator
    cmds:
      - gofmt -l . | tee /dev/stderr | (! grep -q .)
      - go build ./...
      - rm -f migrator

  test:
    desc: 'Run the migrator unit tests (cost-free, no cluster) — these assert that verification actually detects a broken migration'
    dir: deploy/migrator
    cmds: [go test ./...]

  lint:
    desc: Lint Terraform/Terragrunt, the migrator, and the Helm values (cost-free)
    cmds:
      - tflint --recursive
      - task: build
      - |
        cd deploy/migrator && go vet ./...
      - |
        helm repo add vm https://victoriametrics.github.io/helm-charts/ >/dev/null 2>&1 || true
        helm repo update vm >/dev/null 2>&1 || true
        helm lint vm/victoria-metrics-k8s-stack --version {{.VM_STACK_CHART}} -f deploy/source/vm-values.yaml
        helm lint vm/victoria-metrics-k8s-stack --version {{.VM_STACK_CHART}} -f deploy/target/vm-values.yaml
        helm lint vm/victoria-logs-single --version {{.VL_CHART}} -f deploy/source/vl-values.yaml
        helm lint vm/victoria-logs-single --version {{.VL_CHART}} -f deploy/target/vl-values.yaml
        helm lint vm/victoria-logs-collector --version {{.VL_COLLECTOR_CHART}} -f deploy/source/vl-collector-values.yaml
        helm lint vm/victoria-logs-collector --version {{.VL_COLLECTOR_CHART}} -f deploy/target/vl-collector-values.yaml

  plan:
    desc: Plan all infra units (cost-free)
    dir: infra
    cmds: [terragrunt run --all plan]

  # --- Infra --------------------------------------------------------------------------------------
  up:
    desc: 'Provision both VPCs, both clusters, and the three-phase cross-cloud VPN (creates cloud resources)'
    dir: infra
    cmds:
      - terragrunt run --all apply --non-interactive
      - |
        echo ""
        echo "Infra is up. The VPN tunnels take a couple of minutes to establish and for BGP to settle."
        echo "Run 'task vpn-status' until both tunnels are ESTABLISHED before deploying."

  vpn-status:
    desc: 'Show whether both VPN tunnels are up and BGP has exchanged routes (cost-free; run before migrating)'
    cmds:
      - |
        : "${GCP_PROJECT:?set GCP_PROJECT}"
        REGION="${GCP_REGION:-us-central1}"
        ROUTER="$(cd infra/gcp/vpn-tunnels && terragrunt output -raw router_name)"

        echo "=== Cloud VPN tunnels (GCP side) ==="
        gcloud compute vpn-tunnels list \
          --project "$GCP_PROJECT" \
          --filter="region:($REGION)" \
          --format="table(name, status, detailedStatus)"

        echo ""
        echo "=== BGP sessions and routes learned FROM AWS ==="
        # The real test. Tunnels can sit ESTABLISHED while BGP never comes up (an ASN mismatch does
        # exactly that), and then nothing routes even though everything looks connected.
        gcloud compute routers get-status "$ROUTER" \
          --project "$GCP_PROJECT" \
          --region "$REGION" \
          --format="yaml(result.bgpPeerStatus[].name, result.bgpPeerStatus[].state, result.bgpPeerStatus[].status, result.bgpPeerStatus[].advertisedRoutes[].destRange, result.bgpPeerStatus[].learnedRoutes[].destRange)"

        echo ""
        echo "Expect: both tunnels ESTABLISHED, both BGP peers state=Established, and learned routes"
        echo "covering the AWS VPC range (10.20.0.0/16). If BGP is stuck in Connect, suspect the ASNs."

  kubeconfig:
    desc: Add kubeconfig entries for BOTH clusters under stable context names
    cmds:
      - |
        : "${AWS_REGION:?set AWS_REGION}"
        aws eks update-kubeconfig \
          --name {{.SOURCE_CLUSTER}} --region "$AWS_REGION" --alias {{.SOURCE_CTX}}
      - |
        : "${GCP_PROJECT:?set GCP_PROJECT}"
        REGION="${GCP_REGION:-us-central1}"
        gcloud container clusters get-credentials {{.TARGET_CLUSTER}} \
          --region "$REGION" --project "$GCP_PROJECT"
        # gcloud names the context gke_<project>_<region>_<cluster>; rename it so every command in this
        # Taskfile can say --context vmmig-target and mean it.
        RAW="gke_${GCP_PROJECT}_${REGION}_{{.TARGET_CLUSTER}}"
        kubectl config delete-context {{.TARGET_CTX}} >/dev/null 2>&1 || true
        kubectl config rename-context "$RAW" {{.TARGET_CTX}}
      - 'echo "Contexts ready: {{.SOURCE_CTX}} (EKS, source) and {{.TARGET_CTX}} (GKE, target)."'

  # --- Deploy the observability stacks ------------------------------------------------------------
  deploy:
    desc: 'Deploy VictoriaMetrics + VictoriaLogs to BOTH clusters, and Grafana + the dashboard to the target'
    cmds:
      - task: deploy-source
      - task: deploy-target

  deploy-source:
    desc: 'Deploy the SOURCE stack on EKS (VM + VL + collector + generators + the internal endpoints)'
    cmds:
      - task: helm-repo
      - kubectl --context {{.SOURCE_CTX}} create namespace {{.NS}} --dry-run=client -o yaml | kubectl --context {{.SOURCE_CTX}} apply -f -
      - |
        helm --kube-context {{.SOURCE_CTX}} upgrade --install {{.VM_RELEASE}} vm/victoria-metrics-k8s-stack \
          --version {{.VM_STACK_CHART}} --namespace {{.NS}} \
          -f deploy/source/vm-values.yaml \
          --wait --timeout 15m
      - |
        helm --kube-context {{.SOURCE_CTX}} upgrade --install {{.VL_RELEASE}} vm/victoria-logs-single \
          --version {{.VL_CHART}} --namespace {{.NS}} \
          -f deploy/source/vl-values.yaml \
          --wait --timeout 10m
      - kubectl --context {{.SOURCE_CTX}} apply -f deploy/source/vl-private-lb.yaml
      - |
        helm --kube-context {{.SOURCE_CTX}} upgrade --install {{.VLC_RELEASE}} vm/victoria-logs-collector \
          --version {{.VL_COLLECTOR_CHART}} --namespace {{.NS}} \
          -f deploy/source/vl-collector-values.yaml \
          --wait --timeout 10m
      # Generators last: the VMServiceScrape they declare needs the operator's CRDs, installed above.
      - kubectl --context {{.SOURCE_CTX}} apply -f deploy/source/generators.yaml
      - task: migrator-configmap
        vars: { CTX: '{{.SOURCE_CTX}}' }
      - |
        echo ""
        echo "Waiting for the source's internal load balancers to get an address..."
        for i in $(seq 1 40); do
          VM_HOST="$(kubectl --context {{.SOURCE_CTX}} -n {{.NS}} get svc vmsingle-endpoint -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
          VL_HOST="$(kubectl --context {{.SOURCE_CTX}} -n {{.NS}} get svc vl-private-lb -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
          if [ -n "$VM_HOST" ] && [ -n "$VL_HOST" ]; then
            echo "  VictoriaMetrics : $VM_HOST:8428"
            echo "  VictoriaLogs    : $VL_HOST:9428"
            echo "Both are INTERNAL load balancers — private addresses, reachable only over the VPN."
            exit 0
          fi
          echo "  not ready yet ($i/40) — retrying in 15s"; sleep 15
        done
        echo "ERROR: the load balancers never got an address." >&2
        echo "Most common cause: the private subnets are missing the kubernetes.io/role/internal-elb" >&2
        echo "or kubernetes.io/cluster/{{.SOURCE_CLUSTER}} tag, so subnet discovery found nothing." >&2
        exit 1

  deploy-target:
    desc: 'Deploy the TARGET stack on GKE (VM + VL + collector + Grafana + both source datasources + the dashboard)'
    cmds:
      - task: helm-repo
      - kubectl --context {{.TARGET_CTX}} create namespace {{.NS}} --dry-run=client -o yaml | kubectl --context {{.TARGET_CTX}} apply -f -
      - |
        helm --kube-context {{.TARGET_CTX}} upgrade --install {{.VL_RELEASE}} vm/victoria-logs-single \
          --version {{.VL_CHART}} --namespace {{.NS}} \
          -f deploy/target/vl-values.yaml \
          --wait --timeout 10m
      - |
        helm --kube-context {{.TARGET_CTX}} upgrade --install {{.VM_RELEASE}} vm/victoria-metrics-k8s-stack \
          --version {{.VM_STACK_CHART}} --namespace {{.NS}} \
          -f deploy/target/vm-values.yaml \
          --wait --timeout 15m
      - |
        helm --kube-context {{.TARGET_CTX}} upgrade --install {{.VLC_RELEASE}} vm/victoria-logs-collector \
          --version {{.VL_COLLECTOR_CHART}} --namespace {{.NS}} \
          -f deploy/target/vl-collector-values.yaml \
          --wait --timeout 10m
      # Grafana's view of the SOURCE. Rendered here rather than baked into the Helm values because the
      # URLs are the source's internal load balancer hostnames, which only exist once it is deployed.
      - |
        {{.RESOLVE_ENDPOINTS}}
        echo "==> pointing Grafana at the source over the VPN ($SOURCE_VM_HOST, $SOURCE_VL_HOST)"
        sed -e "s|__SOURCE_VM_HOST__|$SOURCE_VM_HOST|g" \
            -e "s|__SOURCE_VL_HOST__|$SOURCE_VL_HOST|g" \
            deploy/target/source-datasources.yaml \
          | kubectl --context {{.TARGET_CTX}} apply -f -
      - kubectl --context {{.TARGET_CTX}} apply -f deploy/target/dashboard.yaml
      - task: migrator-configmap
        vars: { CTX: '{{.TARGET_CTX}}' }
      - |
        echo ""
        echo "Target deployed. Grafana picks up the datasources and dashboard within ~a minute"
        echo "(its sidecar polls for labelled ConfigMaps). Open it with 'task grafana'."

  # --- The migration itself -----------------------------------------------------------------------
  seed:
    desc: 'Write the deterministic, BACKDATED dataset into the SOURCE (runs as a Job on EKS)'
    cmds:
      - task: migrator-configmap
        vars: { CTX: '{{.SOURCE_CTX}}' }
      - |
        DAYS="${SEED_DAYS:-7}"
        echo "==> seeding ${DAYS} days of backdated metrics and logs into the source"
        kubectl --context {{.SOURCE_CTX}} -n {{.NS}} delete job seed --ignore-not-found --wait=true
        sed -e "s|__SEED_DAYS__|$DAYS|g" deploy/jobs/seed-job.yaml \
          | kubectl --context {{.SOURCE_CTX}} apply -f -
        kubectl --context {{.SOURCE_CTX}} -n {{.NS}} wait --for=condition=complete job/seed --timeout=15m \
          || { kubectl --context {{.SOURCE_CTX}} -n {{.NS}} logs job/seed --tail=100; exit 1; }
        kubectl --context {{.SOURCE_CTX}} -n {{.NS}} logs job/seed

  migrate:
    desc: 'Migrate metrics (vmctl) and logs from the SOURCE to the TARGET — Jobs in GKE, pulling over the private VPN'
    cmds:
      - task: migrator-configmap
        vars: { CTX: '{{.TARGET_CTX}}' }
      - |
        {{.RESOLVE_ENDPOINTS}}

        DAYS="${SEED_DAYS:-7}"
        # Reach back further than the seed window so nothing is clipped, and record the cutoff ONCE so
        # `verify` compares exactly what was asked to move. BSD date (macOS) and GNU date (CI) disagree
        # about relative-date flags, so handle both.
        BACK=$((DAYS + 2))
        if date -u -v-1d >/dev/null 2>&1; then
          START="$(date -u -v-${BACK}d +%Y-%m-%dT00:00:00Z)"
        else
          START="$(date -u -d "${BACK} days ago" +%Y-%m-%dT00:00:00Z)"
        fi
        CUTOFF="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        printf 'MIGRATE_START=%s\nMIGRATE_CUTOFF=%s\n' "$START" "$CUTOFF" > {{.WINDOW_FILE}}
        echo "==> migration window recorded in {{.WINDOW_FILE}}: $START .. $CUTOFF"
        echo ""

        echo "==> METRICS: vmctl vm-native, pulling from $SOURCE_VM_HOST across the VPN"
        kubectl --context {{.TARGET_CTX}} -n {{.NS}} delete job migrate-metrics --ignore-not-found --wait=true
        sed -e "s|__SOURCE_VM_HOST__|$SOURCE_VM_HOST|g" \
            -e "s|__MIGRATE_START__|$START|g" \
            -e "s|__MIGRATE_END__|$CUTOFF|g" \
            deploy/jobs/migrate-metrics-job.yaml \
          | kubectl --context {{.TARGET_CTX}} apply -f -
        kubectl --context {{.TARGET_CTX}} -n {{.NS}} wait --for=condition=complete job/migrate-metrics --timeout=60m \
          || { kubectl --context {{.TARGET_CTX}} -n {{.NS}} logs job/migrate-metrics --tail=200; exit 1; }
        kubectl --context {{.TARGET_CTX}} -n {{.NS}} logs job/migrate-metrics --tail=40
        echo ""

        echo "==> LOGS: export/import, pulling from $SOURCE_VL_HOST across the VPN"
        kubectl --context {{.TARGET_CTX}} -n {{.NS}} delete job migrate-logs --ignore-not-found --wait=true
        sed -e "s|__SOURCE_VL_HOST__|$SOURCE_VL_HOST|g" \
            -e "s|__MIGRATE_START__|$START|g" \
            -e "s|__MIGRATE_END__|$CUTOFF|g" \
            deploy/jobs/migrate-logs-job.yaml \
          | kubectl --context {{.TARGET_CTX}} apply -f -
        kubectl --context {{.TARGET_CTX}} -n {{.NS}} wait --for=condition=complete job/migrate-logs --timeout=60m \
          || { kubectl --context {{.TARGET_CTX}} -n {{.NS}} logs job/migrate-logs --tail=200; exit 1; }
        kubectl --context {{.TARGET_CTX}} -n {{.NS}} logs job/migrate-logs

  verify:
    desc: 'Exact full-history diff of the migrated seed dataset; fails on any mismatch and publishes the verdict as metrics'
    cmds:
      - task: migrator-configmap
        vars: { CTX: '{{.TARGET_CTX}}' }
      - |
        if [ ! -f {{.WINDOW_FILE}} ]; then
          echo "ERROR: no {{.WINDOW_FILE}} — run 'task migrate' first." >&2
          echo "       (Verification compares the exact window the migration was given, rather than" >&2
          echo "        guessing one, so the two can never disagree about what should have moved.)" >&2
          exit 1
        fi
        . ./{{.WINDOW_FILE}}
        {{.RESOLVE_ENDPOINTS}}

        echo "==> verifying window $MIGRATE_START .. $MIGRATE_CUTOFF"
        kubectl --context {{.TARGET_CTX}} -n {{.NS}} delete job verify --ignore-not-found --wait=true
        sed -e "s|__SOURCE_VM_HOST__|$SOURCE_VM_HOST|g" \
            -e "s|__SOURCE_VL_HOST__|$SOURCE_VL_HOST|g" \
            -e "s|__MIGRATE_START__|$MIGRATE_START|g" \
            -e "s|__MIGRATE_CUTOFF__|$MIGRATE_CUTOFF|g" \
            deploy/jobs/verify-job.yaml \
          | kubectl --context {{.TARGET_CTX}} apply -f -

        # Poll for EITHER outcome rather than `kubectl wait`, because a mismatch is a legitimate result
        # and `kubectl wait --for=condition=complete` would simply time out on it — turning "the data
        # does not match" into "something hung", which is the wrong story. A failed verification is the
        # most interesting output this lab produces and must never be swallowed.
        OUTCOME=""
        for _ in $(seq 1 180); do
          SUCCEEDED="$(kubectl --context {{.TARGET_CTX}} -n {{.NS}} get job verify -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
          FAILED="$(kubectl --context {{.TARGET_CTX}} -n {{.NS}} get job verify -o jsonpath='{.status.failed}' 2>/dev/null || true)"
          if [ "$SUCCEEDED" = "1" ]; then OUTCOME=passed; break; fi
          if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then OUTCOME=failed; break; fi
          sleep 10
        done

        kubectl --context {{.TARGET_CTX}} -n {{.NS}} logs job/verify || true
        echo ""
        case "$OUTCOME" in
          passed) echo "Verification PASSED. See it rendered with 'task grafana'." ;;
          failed) echo "Verification FAILED — see the diff above." >&2; exit 1 ;;
          *)      echo "Verification did not finish within 30 minutes." >&2; exit 1 ;;
        esac

  all:
    desc: 'After `up` and `deploy`: seed -> migrate -> verify'
    cmds:
      - task: seed
      - task: migrate
      - task: verify

  # --- Looking at it ------------------------------------------------------------------------------
  grafana:
    desc: 'Port-forward the target Grafana to http://localhost:3000 and print the admin password'
    cmds:
      - |
        echo "Grafana admin password:"
        kubectl --context {{.TARGET_CTX}} -n {{.NS}} get secret grafana \
          -o jsonpath='{.data.admin-password}' | base64 -d
        echo ""
        echo ""
        echo "Open http://localhost:3000 (user: admin) and find the dashboard"
        echo "'VictoriaMetrics/VictoriaLogs migration: EKS -> GKE'."
        echo "Ctrl-C to stop the port-forward."
        kubectl --context {{.TARGET_CTX}} -n {{.NS}} port-forward svc/grafana 3000:80

  status:
    desc: 'Show both stacks and the migration Jobs at a glance'
    cmds:
      - echo "=== SOURCE (EKS) ==="
      - kubectl --context {{.SOURCE_CTX}} -n {{.NS}} get pods,svc
      - kubectl --context {{.SOURCE_CTX}} -n generators get pods 2>/dev/null || true
      - echo ""
      - echo "=== TARGET (GKE) ==="
      # Node count first. An Autopilot cluster that cannot register nodes still reports RUNNING, and
      # the only symptom is every pod Pending with "no nodes available" — which reads like a capacity
      # problem and is usually an IAM one. See docs/adr/0003.
      - |
        NODES="$(kubectl --context {{.TARGET_CTX}} get nodes --no-headers 2>/dev/null | wc -l | tr -d ' ')"
        echo "nodes: $NODES"
        if [ "$NODES" = "0" ]; then
          echo "  WARNING: zero nodes. Autopilot scales to zero only when nothing is scheduled —"
          echo "  if kube-system pods are Pending too, the node service account is missing"
          echo "  roles/container.defaultNodeServiceAccount. See docs/adr/0003."
        fi
      - kubectl --context {{.TARGET_CTX}} -n {{.NS}} get pods,svc
      - echo ""
      - echo "=== Jobs ==="
      - kubectl --context {{.SOURCE_CTX}} -n {{.NS}} get jobs 2>/dev/null || true
      - kubectl --context {{.TARGET_CTX}} -n {{.NS}} get jobs 2>/dev/null || true

  # --- Teardown ----------------------------------------------------------------------------------
  clean-k8s:
    desc: 'Remove the in-cluster pieces from both clusters (REQUIRED before `down` — see the note)'
    cmds:
      # This is not optional politeness. The source's two INTERNAL load balancers are created by
      # Kubernetes, not Terraform, so Terraform does not know they exist. Left behind, their ENIs and
      # security groups keep the VPC alive and `terragrunt destroy` fails partway through with a
      # dependency violation that takes a while to interpret.
      - |
        echo "==> removing the source's load-balanced Services first (Terraform cannot see them)"
        kubectl --context {{.SOURCE_CTX}} delete -f deploy/source/vl-private-lb.yaml --ignore-not-found || true
        kubectl --context {{.SOURCE_CTX}} delete -f deploy/source/generators.yaml --ignore-not-found || true
        for r in {{.VLC_RELEASE}} {{.VL_RELEASE}} {{.VM_RELEASE}}; do
          helm --kube-context {{.SOURCE_CTX}} uninstall "$r" -n {{.NS}} --wait || true
        done
      - |
        echo "==> waiting for the AWS load balancers to actually go away"
        for i in $(seq 1 20); do
          REMAINING="$(kubectl --context {{.SOURCE_CTX}} -n {{.NS}} get svc -o jsonpath='{.items[?(@.spec.type=="LoadBalancer")].metadata.name}' 2>/dev/null || true)"
          [ -z "$REMAINING" ] && { echo "   all load-balanced Services are gone"; break; }
          echo "   still present: $REMAINING ($i/20)"; sleep 15
        done
      - |
        echo "==> removing the target stack"
        for r in {{.VLC_RELEASE}} {{.VM_RELEASE}} {{.VL_RELEASE}}; do
          helm --kube-context {{.TARGET_CTX}} uninstall "$r" -n {{.NS}} --wait || true
        done

  down:
    desc: 'Destroy everything (runs clean-k8s first, then all infra on AWS and GCP)'
    cmds:
      - task: clean-k8s
      - rm -f {{.WINDOW_FILE}}
      - task: destroy-infra

  # --- Internal helpers ---------------------------------------------------------------------------
  destroy-infra:
    internal: true
    dir: infra
    cmds: [terragrunt run --all destroy --non-interactive]

  helm-repo:
    internal: true
    cmds:
      - helm repo add vm https://victoriametrics.github.io/helm-charts/ >/dev/null 2>&1 || true
      - helm repo update vm >/dev/null

  migrator-configmap:
    internal: true
    # The Go sources are delivered as a ConfigMap and run with `go run`, so this lab needs no container
    # registry in either cloud and no build-and-push step: deploy/migrator/ is what runs.
    #
    # The test file travels along, which is harmless — `go run .` excludes _test.go from the build — and
    # means the code in the cluster is exactly the code that was tested.
    cmds:
      - |
        kubectl --context {{.CTX}} -n {{.NS}} create configmap migrator-src \
          --from-file=deploy/migrator/ \
          --dry-run=client -o yaml \
        | kubectl --context {{.CTX}} apply -f -
