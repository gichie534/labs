# Redirect all plain-HTTP traffic on the Gateway's port-80 listener to HTTPS (301). Hostname-less so
# it covers both the Argo CD and Grafana hosts.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: common-redirect
  namespace: platform
spec:
  parentRefs:
    - name: common
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
