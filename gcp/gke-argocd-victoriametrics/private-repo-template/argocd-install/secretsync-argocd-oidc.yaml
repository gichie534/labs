# Materializes the Argo CD OIDC client secret from Secret Manager into the k8s Secret `argocd-oidc`.
# The `app.kubernetes.io/part-of: argocd` label is what lets Argo CD resolve `$argocd-oidc:oidc.clientSecret`.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: argocd-oidc
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/__PROJECT_ID__/secrets/argocd-oidc-client-secret/versions/latest"
        path: "oidc.clientSecret"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: argocd-oidc
spec:
  serviceAccountName: argocd-secret-sync
  secretProviderClassName: argocd-oidc
  secretObject:
    type: Opaque
    labels:
      app.kubernetes.io/part-of: argocd
    data:
      - sourcePath: "oidc.clientSecret"
        targetKey: "oidc.clientSecret"
