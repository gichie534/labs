# Identity the SecretSync controller uses to read Secret Manager for the two Argo CD secrets. Keyless
# via Workload Identity: this KSA impersonates the GSA created by the lab's `infra/secrets` unit
# (gcp/workload-iam module), which holds the secretAccessor grants. No service-account key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-secret-sync
  annotations:
    iam.gke.io/gcp-service-account: argocd-secret-sync@__PROJECT_ID__.iam.gserviceaccount.com
