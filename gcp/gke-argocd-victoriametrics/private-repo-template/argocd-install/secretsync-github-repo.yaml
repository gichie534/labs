# Materializes the private-repo connection as an Argo CD repository Secret (label
# argocd.argoproj.io/secret-type: repository) straight from Secret Manager. Argo CD reads GitHub App
# credentials only from such a Secret with the fields inline, so SecretSync assembles all of them
# (url + App id + installation id + private key) from four Secret Manager entries. Argo CD then
# matches this Secret to any Application whose repoURL equals `url`.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: github-repo
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/__PROJECT_ID__/secrets/github-repo-url/versions/latest"
        path: "url"
      - resourceName: "projects/__PROJECT_ID__/secrets/github-app-id/versions/latest"
        path: "githubAppID"
      - resourceName: "projects/__PROJECT_ID__/secrets/github-app-installation-id/versions/latest"
        path: "githubAppInstallationID"
      - resourceName: "projects/__PROJECT_ID__/secrets/github-app-private-key/versions/latest"
        path: "githubAppPrivateKey"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: github-repo
spec:
  serviceAccountName: argocd-secret-sync
  secretProviderClassName: github-repo
  secretObject:
    type: Opaque
    labels:
      argocd.argoproj.io/secret-type: repository
    data:
      - sourcePath: "url"
        targetKey: "url"
      - sourcePath: "githubAppID"
        targetKey: "githubAppID"
      - sourcePath: "githubAppInstallationID"
        targetKey: "githubAppInstallationID"
      - sourcePath: "githubAppPrivateKey"
        targetKey: "githubAppPrivateKey"
