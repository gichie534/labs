# Redirects all plain-HTTP traffic on the Gateway's port-80 listener to HTTPS (301). Same as base.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-redirect
spec:
  parentRefs:
    - name: argocd
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
