# Global external Application Load Balancer fronting Argo CD (see base lab). TLS via the Certificate
# Manager certmap "argocd"; HTTPS listener needs no tls block. Reserved static IP by NamedAddress.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd
  annotations:
    networking.gke.io/certmap: argocd
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: argocd-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
