apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          # GKE Autopilot rewrites requests up to its per-container minimums (50m CPU / 52Mi mem),
          # which otherwise leaves the Deployment permanently OutOfSync in Argo CD. Declaring
          # requests above those minimums, with limits == requests, means Autopilot doesn't mutate
          # anything, so there's no perpetual diff.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
